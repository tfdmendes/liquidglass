<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title description">
<title id="title">Map-cache CPU time vs 068ad22</title>
<desc id="description">Accumulated browser-process and descendant CPU time in milliseconds, not CPU utilization or real-time frame cost. Each engine uses the same 0 to 5,000 ms axis. Values are medians, whiskers span the minimum and maximum of three fresh-browser trials. Original is a circle; map reuse is a square. These are independent map-cache measurements, not a benchmark of all four changes together. Chrome 156.0.8078.48, button: original median 1,440, range 1,420–1,530; map reuse median 1,280, range 1,270–1,340 ms. Firefox 157.0, button: original median 2,870, range 2,100–3,020; map reuse median 2,380, range 1,400–3,010 ms. Chrome 156.0.8078.48, segmented: original median 4,590, range 3,590–4,790; map reuse median 4,360, range 4,300–4,540 ms. Firefox 157.0, segmented: original median 4,770, range 2,880–4,840; map reuse median 4,560, range 4,300–4,630 ms. Chrome 156.0.8078.48, mostly-unique: original median 2,730, range 2,710–2,820; map reuse median 2,770, range 2,770–2,850 ms. Firefox 157.0, mostly-unique: original median 1,850, range 1,830–1,870; map reuse median 1,870, range 1,810–1,900 ms. Mostly-unique CPU overhead: +1.5% Chrome · +1.1% Gecko. Ranges are noisy; no statistical significance is claimed.</desc>
<metadata>Source: evidence.json; SHA-256: c0a594e4945862915435f7b7e2b859f2d87a61982de25674655336efbeb91c57</metadata>
