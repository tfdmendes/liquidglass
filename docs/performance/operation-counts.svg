<svg xmlns="http://www.w3.org/2000/svg" width="760" height="744" viewBox="0 0 760 744" role="img" aria-labelledby="title description">
<title id="title">Measured operation counts</title>
<desc id="description">Each change was measured separately against upstream 068ad22. Bars show operation counts, not CPU savings. Each row has its own unit and original = 100% scale. Map PNG encodes: 149 original to 41 candidate PNG encodes. Button · 12 cycles · Chrome / Blink. Initial SVG attribute writes: 182 original to 62 candidate SVG attribute mutations. Static lens · Chrome / Blink. Scroll geometry reads: 33,524 original to 8,561 candidate geometry API reads. 240 extra surfaces · 35 positions · Chrome. Idle WebGL source uploads: 18 original to 0 candidate source texture uploads. Unchanged ImageBitmap · 302 ms · Chrome.</desc>
<metadata>Source: evidence.json; SHA-256: c0a594e4945862915435f7b7e2b859f2d87a61982de25674655336efbeb91c57</metadata>
